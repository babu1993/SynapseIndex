[project]
name = "synapseindex"
version = "1.0.0"
description = "Build page-level indexes from Markdown documents for AI and LLM context retrieval"
readme = "README.md"
authors = [
    { name = "bharathbabu", email = "bharath.r.babu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "boto3>=1.42.97",
    "litellm>=1.83.14",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
synapseindex = "synapseindex.cli:main"
